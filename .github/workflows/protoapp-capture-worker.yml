name: Build and Deploy protoapp-capture-worker

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'capture-worker/**'
      - '.github/workflows/protoapp-capture-worker.yml'

env:
  PRODUCT_SLUG: protoapp
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::339713122183:role/github-actions-admin-aws

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capture-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  prepare-ecr:
    name: Prepare ECR Repository
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.captureWorkerEcrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"
      - name: Upsert ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-ecr
    steps:
      - uses: actions/checkout@v5

      # QEMU registers binfmt handlers so the build can run under arm64.
      # Playwright base image (mcr.microsoft.com/playwright:*-jammy) is
      # multi-arch, so emulation only kicks in for the final layers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.captureWorkerEcrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: capture-worker
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ecs:
    name: Deploy to protoapp
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECS_CLUSTER=$(jq -r .aws.ecsCluster /tmp/manifest.json)"
            echo "ECS_SERVICE=$(jq -r .aws.captureWorkerEcsService /tmp/manifest.json)"
          } >> "$GITHUB_ENV"
      - name: Force-deploy ECS service
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_REGION"
