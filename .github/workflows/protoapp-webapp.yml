name: Build and Deploy protoapp-webapp

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'webapp/**'
      - '.github/workflows/protoapp-webapp.yml'

env:
  PRODUCT_SLUG: protoapp
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::339713122183:role/github-actions-admin-aws

defaults:
  run:
    working-directory: webapp

jobs:
  build-and-deploy:
    name: Build and deploy webapp
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest + public build-time config from SSM
        working-directory: ./
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          SSM_PRODUCT_PREFIX=$(jq -r .ssm.productPrefix /tmp/manifest.json)
          SSM_PLATFORM_PREFIX=$(jq -r .ssm.platformPrefix /tmp/manifest.json)
          {
            echo "S3_BUCKET=$(jq -r .aws.webappS3Bucket /tmp/manifest.json)"
            echo "CLOUDFRONT_DISTRIBUTION_ID=$(jq -r .aws.cloudfrontDistributionId /tmp/manifest.json)"
            echo "DOMAIN=$(jq -r .domains.app /tmp/manifest.json)"
            echo "VITE_GOOGLE_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_PRODUCT_PREFIX}/google_client_id" --query Parameter.Value --output text)"
            echo "VITE_STRIPE_PUBLISHABLE_KEY=$(aws ssm get-parameter --name "${SSM_PLATFORM_PREFIX}/payments/stripe_publishable_key" --query Parameter.Value --output text)"
            echo "VITE_TURNSTILE_SITE_KEY=$(aws ssm get-parameter --name "${SSM_PLATFORM_PREFIX}/auth/turnstile_site_key" --query Parameter.Value --output text)"
          } >> "$GITHUB_ENV"

      - name: Build Vite app
        env:
          VITE_API_URL: https://${{ env.DOMAIN }}
          VITE_GOOGLE_REDIRECT_URL: https://${{ env.DOMAIN }}/api/auth/google/callback
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

          aws s3 sync ./dist "s3://${S3_BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
          echo "Webapp deployed to https://${DOMAIN}"
