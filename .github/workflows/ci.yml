name: Growth Tools CI/CD

permissions:
  id-token: write  # Required for OIDC-based authentication
  contents: read   # Required for actions/checkout

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────────
  lint-webapp:
    name: Lint Webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Run lint
        working-directory: webapp
        run: npm run lint

  # ─── Build & Test Backend ──────────────────────────────────────────────────────
  build-and-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: base-server/go.sum

      - name: Install dependencies
        working-directory: base-server
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('base-server/docker-compose.yml') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Load cached Docker images
        run: |
          if [ -d /tmp/docker-cache ]; then
            for image in /tmp/docker-cache/*.tar; do
              if [ -f "$image" ]; then
                docker load -i "$image" || true
              fi
            done
          fi

      - name: Create test environment file
        working-directory: base-server
        run: |
          cat > env.local << EOF
          # Database
          DB_HOST=localhost
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=growth_tools

          # Authentication
          JWT_SECRET=test-jwt-secret-key-for-github-actions
          GOOGLE_CLIENT_ID=test-google-client-id
          GOOGLE_CLIENT_SECRET=test-google-client-secret
          GOOGLE_REDIRECT_URI=http://localhost:8080/auth/google/callback
          TURNSTILE_SECRET_KEY=some-key

          # AI
          ANTHROPIC_API_KEY=test-anthropic-key

          # Services (test/dummy values)
          STRIPE_SECRET_KEY=sk_test_dummy_key
          STRIPE_WEBHOOK_SECRET=whsec_test_dummy_secret
          RESEND_API_KEY=re_test_dummy_key
          DEFAULT_EMAIL_SENDER_ADDRESS=test@example.com
          WEBAPP_URI=http://localhost:3000

          # Social Platforms (test/dummy values)
          X_API_KEY=test-x-key
          X_API_SECRET=test-x-secret
          LINKEDIN_CLIENT_ID=test-linkedin-id
          LINKEDIN_CLIENT_SECRET=test-linkedin-secret
          FACEBOOK_APP_ID=test-fb-id
          FACEBOOK_APP_SECRET=test-fb-secret
          TIKTOK_CLIENT_KEY=test-tiktok-key
          TIKTOK_CLIENT_SECRET=test-tiktok-secret
          PINTEREST_APP_ID=test-pinterest-id
          PINTEREST_APP_SECRET=test-pinterest-secret

          # GitHub
          GITHUB_APP_ID=test-github-app-id
          GITHUB_APP_PRIVATE_KEY=test-github-key
          GITHUB_WEBHOOK_SECRET=test-github-secret

          # Kafka
          KAFKA_BROKERS=localhost:9092

          # Server
          SERVER_PORT=8080
          EOF

      - name: Start services with docker-compose
        working-directory: base-server
        run: |
          docker compose up -d --wait postgres kafka
          docker compose up flyway

      - name: Build the application
        working-directory: base-server
        run: go build -v -o growth-server .

      - name: Run unit tests (mocked - no DB needed)
        working-directory: base-server
        run: go test -coverprofile=coverage.out -covermode=atomic -short ./internal/.../processor/... ./internal/.../service/...

      - name: Run store tests (requires DB)
        working-directory: base-server
        run: go test -coverprofile=coverage-store.out -covermode=atomic -short ./internal/store/...

      - name: Run race detection
        if: github.event_name == 'push'
        working-directory: base-server
        run: go test -race -short ./...

      - name: Start API server in background
        working-directory: base-server
        run: |
          ./growth-server &
          echo $! > server.pid
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 1; done'

      - name: Run integration tests
        working-directory: base-server
        env:
          TEST_API_HOST: localhost
          TEST_API_PORT: 8080
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASS: postgres
          TEST_DB_NAME: growth_tools
        run: go test -v -race -tags=integration ./tests/...

      - name: Stop API server
        if: always()
        working-directory: base-server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Display test coverage
        working-directory: base-server
        run: |
          echo "=== Unit test coverage ==="
          go tool cover -func=coverage.out
          echo ""
          echo "=== Store test coverage ==="
          go tool cover -func=coverage-store.out

      - name: Save Docker images to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache
          docker save postgres:16-alpine -o /tmp/docker-cache/postgres.tar || true
          docker save flyway/flyway:10 -o /tmp/docker-cache/flyway.tar || true
          docker save confluentinc/cp-kafka:7.6.0 -o /tmp/docker-cache/kafka.tar || true

      - name: Stop services
        if: always()
        working-directory: base-server
        run: docker compose down -v

  # ─── Build Webapp ──────────────────────────────────────────────────────────────
  build-webapp:
    name: Build Webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Build Vite app
        working-directory: webapp
        run: npm run build

  # ─── Build CLI ─────────────────────────────────────────────────────────────────
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        working-directory: cli
        run: go mod download

      - name: Build CLI
        working-directory: cli
        run: go build -o growth-cli .

  # ─── Prepare ECR (deploy only) ────────────────────────────────────────────────
  prepare-ecr:
    name: Prepare ECR Repository
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-webapp, build-cli, lint-webapp]
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions

      - name: Upsert ECR repository
        run: |
          aws ecr describe-repositories --repository-names growth-tools || \
            aws ecr create-repository --repository-name growth-tools

  # ─── Build and Push Docker Image (deploy only) ─────────────────────────────────
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-ecr
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./base-server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/growth-tools:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/growth-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy Backend to ECS (deploy only) ───────────────────────────────────────
  deploy-ecs:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster gt-ecs-cluster \
            --service gt-api-service \
            --force-new-deployment \
            --region us-east-1

  # ─── Deploy Webapp to S3/CloudFront (deploy only) ──────────────────────────────
  deploy-webapp:
    name: Deploy Webapp to S3/CloudFront
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-webapp, lint-webapp]
    if: github.event_name == 'push'
    env:
      S3_BUCKET: ${{ vars.WEBAPP_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Build Vite app with production env vars
        working-directory: webapp
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URL: ${{ vars.VITE_GOOGLE_REDIRECT_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions

      - name: Deploy to S3
        working-directory: webapp
        run: |
          # Sync all files except HTML with long cache
          aws s3 sync ./dist s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"

          # Sync HTML files with no-cache for SPA routing
          aws s3 sync ./dist s3://${{ env.S3_BUCKET }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
