name: Build and Deploy protoapp-server

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'base-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/protoapp-server.yml'

env:
  # Bootstrap only. Everything else (ECR repo, ECS cluster/service, S3 bucket,
  # CloudFront id) is read live from /${PRODUCT_SLUG}/manifest in SSM — written
  # by the infra repo (SAVentures/base-infra) at terraform apply.
  PRODUCT_SLUG: protoapp
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::339713122183:role/github-actions-admin-aws

jobs:
  # Three test jobs run in parallel on separate runners so the race
  # detector isn't serialized behind store + integration.
  # ECR prep / docker build / deploy gate on all three.

  test-race:
    name: Unit + Race (go test -race -short)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: base-server/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Build the application
        run: go build -v ./...
      - name: Unit tests + race detector
        run: go test -race -short ./...

  test-store:
    name: Store tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-store-${{ runner.os }}-${{ hashFiles('base-server/docker-compose.test.yml', 'base-server/Dockerfile.test') }}
          restore-keys: |
            docker-store-${{ runner.os }}-
      - name: Load cached Docker images
        run: |
          if [ -d /tmp/docker-cache ]; then
            for image in /tmp/docker-cache/*.tar; do
              [ -f "$image" ] && docker load -i "$image" || true
            done
          fi
      - name: Bring up DB + Kafka + Flyway (no server needed)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait db kafka
          docker compose -f docker-compose.test.yml up flyway
      - name: Run store tests
        run: docker compose -f docker-compose.test.yml run --rm --no-deps runner go test -race ./internal/infra/store/...
      - name: Save Docker images to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache
          docker save postgres:15-alpine -o /tmp/docker-cache/postgres.tar || true
          docker save flyway/flyway -o /tmp/docker-cache/flyway.tar || true
          docker save confluentinc/cp-kafka:latest -o /tmp/docker-cache/kafka.tar || true
      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs || true

  test-integration:
    name: Integration tests (real HTTP vs Dockerized server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-integration-${{ runner.os }}-${{ hashFiles('base-server/docker-compose.test.yml', 'base-server/Dockerfile', 'base-server/Dockerfile.test') }}
          restore-keys: |
            docker-integration-${{ runner.os }}-
      - name: Load cached Docker images
        run: |
          if [ -d /tmp/docker-cache ]; then
            for image in /tmp/docker-cache/*.tar; do
              [ -f "$image" ] && docker load -i "$image" || true
            done
          fi
      - name: Bring up full stack (db + kafka + flyway + server)
        run: make docker-up
      - name: Run integration tests
        run: make docker-test-integration
      - name: Save Docker images to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache
          docker save postgres:15-alpine -o /tmp/docker-cache/postgres.tar || true
          docker save flyway/flyway -o /tmp/docker-cache/flyway.tar || true
          docker save confluentinc/cp-kafka:latest -o /tmp/docker-cache/kafka.tar || true
      - name: Dump Docker logs on failure
        if: failure()
        run: make docker-logs || true

  prepare-ecr:
    name: Prepare ECR Repository
    runs-on: ubuntu-latest
    needs: [test-race, test-store, test-integration]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.ecrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"
      - name: Upsert ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-ecr
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.ecrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: base-server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ecs:
    name: Deploy to protoapp
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECS_CLUSTER=$(jq -r .aws.ecsCluster /tmp/manifest.json)"
            echo "ECS_SERVICE=$(jq -r .aws.ecsService /tmp/manifest.json)"
          } >> "$GITHUB_ENV"
      - name: Force-deploy ECS service
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_REGION"
