name: Build and Deploy protoapp-server

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'base-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/protoapp-server.yml'

env:
  # Bootstrap only. Everything else (ECR repo, ECS cluster/service, S3 bucket,
  # CloudFront id) is read live from /${PRODUCT_SLUG}/manifest in SSM — written
  # by the infra repo (SAVentures/base-infra) at terraform apply.
  PRODUCT_SLUG: protoapp
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::339713122183:role/github-actions-admin-aws

jobs:
  # Two test jobs run in parallel on separate runners:
  #  - test-race: pure Go, race detector + unit tests, no docker needed.
  #  - test-db: spins up the docker stack once and runs store + integration
  #    tests against the same DB/server, avoiding a redundant bring-up.
  # ECR prep / docker build / deploy gate on both.

  test-race:
    name: Unit + Race (go test -race -short)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: base-server/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Build the application
        run: go build -v ./...
      - name: Unit tests + race detector
        run: go test -race -short ./...

  test-db:
    name: Store + Integration (shared Docker stack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-pull the compose base images (postgres/kafka/flyway) in the
      # background while buildx builds the local images. The pulls land in
      # the shared Docker daemon before `compose up` runs, knocking ~15s
      # off bring-up that would otherwise sit waiting on docker.io.
      - name: Pre-pull compose base images (background)
        run: |
          nohup docker compose -f docker-compose.test.yml pull --quiet db kafka flyway \
            > /tmp/compose-pull.log 2>&1 &
          echo $! > /tmp/compose-pull.pid

      # Build test-server and test-runner in parallel. They hit disjoint
      # GHA cache scopes and, within the runner, one is CPU-bound (go build)
      # while the other is I/O-bound (apk + go mod download), so CPU
      # contention is small.
      #
      # The Dockerfiles use BuildKit cache mounts (/go/pkg/mod,
      # /root/.cache/go-build), which persist across builds inside GHA's
      # cache backend. `mode=min` keeps cache exports small — we only need
      # the final-stage layers for test images; the prod push uses its own
      # `mode=max` scope.
      - name: Build test images (parallel)
        run: |
          set -o pipefail

          docker buildx build \
            --file Dockerfile \
            --tag base-server-test-server:ci \
            --load \
            --cache-from type=gha,scope=test-server \
            --cache-to type=gha,mode=min,scope=test-server \
            . > /tmp/build-server.log 2>&1 &
          SERVER_PID=$!

          docker buildx build \
            --file Dockerfile.test \
            --tag base-server-test-runner:ci \
            --load \
            --cache-from type=gha,scope=test-runner \
            --cache-to type=gha,mode=min,scope=test-runner \
            . > /tmp/build-runner.log 2>&1 &
          RUNNER_PID=$!

          SERVER_RC=0; wait "$SERVER_PID" || SERVER_RC=$?
          RUNNER_RC=0; wait "$RUNNER_PID" || RUNNER_RC=$?

          echo "::group::test-server build log"
          cat /tmp/build-server.log
          echo "::endgroup::"
          echo "::group::test-runner build log"
          cat /tmp/build-runner.log
          echo "::endgroup::"

          [ "$SERVER_RC" -eq 0 ] || { echo "test-server build failed ($SERVER_RC)"; exit "$SERVER_RC"; }
          [ "$RUNNER_RC" -eq 0 ] || { echo "test-runner build failed ($RUNNER_RC)"; exit "$RUNNER_RC"; }

      # Wait for the background compose pull started earlier so `up --wait`
      # does not have to fetch anything from docker.io. `wait` only works on
      # children of the current shell; the pre-pull ran in an earlier step,
      # so we poll with `kill -0` instead.
      - name: Wait for compose pre-pull
        run: |
          PID=$(cat /tmp/compose-pull.pid)
          while kill -0 "$PID" 2>/dev/null; do
            sleep 1
          done
          echo "::group::compose pull log"
          cat /tmp/compose-pull.log
          echo "::endgroup::"

      # One-shot stack bring-up. `--wait server` lets compose handle the
      # dependency graph (db+kafka start in parallel → flyway runs on healthy
      # db → server waits for flyway completion + kafka health), replacing
      # three sequential `docker compose up` calls.
      - name: Bring up full stack
        run: docker compose -f docker-compose.test.yml up -d --wait server

      # Store + integration tests run in a single runner container. Go's
      # package-level parallelism handles both test suites; `-tags=integration`
      # is a no-op for store packages, so one `go test` invocation covers both.
      - name: Store + Integration tests
        run: make docker-test-db

      - name: Dump Docker logs on failure
        if: failure()
        run: make docker-logs || true

  prepare-ecr:
    name: Prepare ECR Repository
    runs-on: ubuntu-latest
    needs: [test-race, test-db]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.ecrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"
      - name: Upsert ECR repository
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: prepare-ecr
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          echo "ECR_REPOSITORY=$(jq -r .aws.ecrRepository /tmp/manifest.json)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: base-server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Share layer cache with the test-server build in test-db. Both use
          # the same Dockerfile, so the production push reuses everything the
          # test build already warmed up.
          cache-from: |
            type=gha,scope=test-server
            type=gha,scope=prod-server
          cache-to: type=gha,mode=max,scope=prod-server

  deploy-ecs:
    name: Deploy to protoapp
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECS_CLUSTER=$(jq -r .aws.ecsCluster /tmp/manifest.json)"
            echo "ECS_SERVICE=$(jq -r .aws.ecsService /tmp/manifest.json)"
          } >> "$GITHUB_ENV"
      - name: Force-deploy ECS service
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_REGION"
