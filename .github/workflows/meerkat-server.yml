name: Build and Deploy meerkat-server

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'base-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/meerkat-server.yml'

# Never interleave two deploys: the migrator task definition pins `:latest`, so
# each run's migrate step must see the image that same run pushed.
concurrency:
  group: meerkat-deploy
  cancel-in-progress: false

env:
  # Bootstrap only. Everything else (ECR repo, ECS cluster/service, S3 bucket,
  # CloudFront id) is read live from /${PRODUCT_SLUG}/manifest in SSM — written
  # by the infra repo (OptimusFoundry/base-infra) at terraform apply.
  PRODUCT_SLUG: meerkat
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::339713122183:role/github-actions-admin-aws

jobs:
  # Pipeline shape:
  #   unit-race ─┐
  #              ├──> build-push ──> migrate ──> deploy-ecs
  #   integ-tests ┘
  #
  # unit-race + integ-tests run in parallel (independent, no shared state).
  # build-push only runs when both are green, so ECR/buildx minutes aren't
  # spent on red commits. migrate runs the Flyway migrator task and gates the
  # deploy: a failed migration leaves the old task serving the old schema. Each job owns one concern and one GHA cache scope —
  # compose base-images cache (postgres/kafka/flyway) is separate from the
  # server buildx cache.

  unit-race:
    name: Unit + Race (go test -race -short)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: base-server/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Unit tests + race detector
        run: go test -race -short ./...

  integ-tests:
    name: Store + Integration (in-process server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: base-server/go.sum

      # Cache the compose base images (postgres / kafka / flyway) as a tarball.
      # Key is the hash of docker-compose.test.yml — invalidates only when a
      # pinned tag changes. On cache hit `docker load` restores in ~2s vs a
      # ~15s cold pull from docker.io.
      - name: Restore compose base images
        id: compose-cache
        uses: actions/cache@v4
        with:
          path: /tmp/compose-images.tar
          key: compose-base-images-${{ hashFiles('base-server/docker-compose.test.yml') }}

      - name: Pull + save compose base images (cache miss)
        if: steps.compose-cache.outputs.cache-hit != 'true'
        run: |
          docker compose -f docker-compose.test.yml pull --quiet db kafka flyway
          IMAGES=$(docker compose -f docker-compose.test.yml config --images | sort -u)
          echo "Saving: $IMAGES"
          docker save $IMAGES -o /tmp/compose-images.tar

      - name: Load compose base images (cache hit)
        if: steps.compose-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/compose-images.tar

      # Bring up db + kafka, then run flyway to apply migrations. Server runs
      # in-process inside the Go test binary — no server container here.
      - name: Bring up test infrastructure
        run: |
          docker compose -f docker-compose.test.yml up -d --wait db kafka
          docker compose -f docker-compose.test.yml up flyway

      # Source env.test so DB_* and other test config match the isolated test
      # stack. Same file the Makefile's `test` target uses — single source of
      # truth for store + integration test config.
      - name: Store tests
        run: |
          set -a; . ./env.test; set +a
          go test -race ./internal/infra/store/...

      - name: Integration tests
        run: |
          set -a; . ./env.test; set +a
          go test -v -race -tags=integration ./tests/...

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=200 || true

  build-push:
    name: Build + Push images to ECR
    runs-on: ubuntu-latest
    needs: [unit-race, integ-tests]
    defaults:
      run:
        working-directory: base-server
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest
        working-directory: .
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECR_REPOSITORY=$(jq -r .aws.ecrRepository /tmp/manifest.json)"
            echo "MIGRATOR_ECR_REPOSITORY=$(jq -r .aws.migratorEcrRepository /tmp/manifest.json)"
          } >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU registers binfmt handlers so the runtime stage (alpine + apk)
      # can execute under arm64 during the final image build. The Go build
      # stage itself cross-compiles natively from amd64 (BUILDPLATFORM).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single buildx invocation: build, tag, and push in one pass with GHA
      # layer cache. `mode=max` exports the full builder stage so the next run
      # starts warm even on Dockerfile tweaks. arm64-only — ECS hosts are
      # Graviton (t4g).
      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --file Dockerfile \
            --platform linux/arm64 \
            --tag "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            --cache-from type=gha,scope=meerkat-server \
            --cache-to type=gha,mode=max,scope=meerkat-server \
            --push \
            .

      - name: Build and push migrator image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --file dbmigrator.dockerfile \
            --platform linux/arm64 \
            --tag "$REGISTRY/$MIGRATOR_ECR_REPOSITORY:${{ github.sha }}" \
            --tag "$REGISTRY/$MIGRATOR_ECR_REPOSITORY:latest" \
            --cache-from type=gha,scope=meerkat-migrator \
            --cache-to type=gha,mode=max,scope=meerkat-migrator \
            --push \
            .

  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions

      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --region "$AWS_REGION" \
            --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECS_CLUSTER=$(jq -er .aws.ecsCluster /tmp/manifest.json)"
            echo "MIGRATOR_TASK_DEFINITION=$(jq -er .aws.migratorTaskDefinition /tmp/manifest.json)"
            echo "LOG_GROUP=$(jq -er .aws.logGroup /tmp/manifest.json)"
          } >> "$GITHUB_ENV"

      # Bridge network mode, so no --network-configuration.
      - name: Start migrator task
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type EC2 \
            --task-definition "$MIGRATOR_TASK_DEFINITION" \
            --started-by "gha-${GITHUB_SHA::7}" \
            --region "$AWS_REGION" \
            --output json > /tmp/run-task.json
          if ! jq -e '(.failures | length) == 0 and (.tasks | length) == 1' /tmp/run-task.json > /dev/null; then
            echo "::error::Migrator task was not placed"
            jq '.failures' /tmp/run-task.json
            exit 1
          fi
          TASK_ARN=$(jq -er '.tasks[0].taskArn' /tmp/run-task.json)
          echo "Started $TASK_ARN"
          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"

      # The waiter gives up after ~10 minutes and exits non-zero; the cleanup
      # step below then stops the task.
      - name: Wait for migrator to stop
        timeout-minutes: 15
        run: aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

      - name: Check migrator exit code
        run: |
          aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" --output json > /tmp/describe-tasks.json
          # A missing container or a null exitCode fails as surely as a non-zero one.
          if ! jq -e '.tasks[0].containers[]? | select(.name == "migrator") | .exitCode == 0' /tmp/describe-tasks.json > /dev/null; then
            echo "::error::Migrator did not exit 0"
            echo "stoppedReason: $(jq -r '.tasks[0].stoppedReason // "none"' /tmp/describe-tasks.json)"
            jq -r '.tasks[0].containers[]? | "container \(.name): exitCode=\(.exitCode // "none") reason=\(.reason // "none")"' /tmp/describe-tasks.json
            exit 1
          fi
          echo "Migrator exited 0"

      - name: Stop migrator task
        if: (failure() || cancelled()) && env.TASK_ARN != ''
        run: |
          aws ecs stop-task --cluster "$ECS_CLUSTER" --task "$TASK_ARN" \
            --reason "meerkat-server workflow failed or was cancelled" \
            --region "$AWS_REGION" --output json > /dev/null || true

      - name: Print migrator log
        if: failure() && env.LOG_GROUP != ''
        run: |
          aws logs tail "$LOG_GROUP" --log-stream-name-prefix migrator --since 15m \
            --region "$AWS_REGION" || true

  deploy-ecs:
    name: Deploy to meerkat
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: GitHubActions
      - name: Load manifest
        run: |
          aws ssm get-parameter --name "/${PRODUCT_SLUG}/manifest" --query Parameter.Value --output text > /tmp/manifest.json
          {
            echo "ECS_CLUSTER=$(jq -r .aws.ecsCluster /tmp/manifest.json)"
            echo "ECS_SERVICE=$(jq -r .aws.ecsService /tmp/manifest.json)"
          } >> "$GITHUB_ENV"
      - name: Force-deploy ECS service
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_REGION"
