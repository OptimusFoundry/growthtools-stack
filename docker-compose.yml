name: growth-tools-dev

services:
  db:
    container_name: growth-tools-dev-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: base_db
      POSTGRES_USER: base_user
      POSTGRES_PASSWORD: base_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - growth_tools_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base_user -d base_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]

  flyway:
    container_name: growth-tools-dev-flyway
    image: flyway/flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./base-server/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/base_db
      FLYWAY_USER: base_user
      FLYWAY_PASSWORD: base_password
      FLYWAY_SCHEMAS: public
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate

  kafka:
    container_name: growth-tools-dev-kafka
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  capture-worker:
    container_name: growth-tools-dev-capture-worker
    build:
      context: ./capture-worker
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      # Default: capture the webapp running on the host. Override if you want
      # to run it against protoapp.xyz — remember the worker needs to be able
      # to hit /test-login there.
      APP_URL: ${CAPTURE_WORKER_APP_URL:-http://host.docker.internal:3000}
      APP_EMAIL: ${CAPTURE_WORKER_APP_EMAIL:-hello@shubhanshu.dev}
      APP_PASSWORD: ${CAPTURE_WORKER_APP_PASSWORD:-playwright-demo}
      # AI model key — pull from your shell env; also reads GOOGLE_AI_API_KEY.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Leave blank to disable auth; set to match the caller for defense in depth.
      CAPTURE_WORKER_SHARED_SECRET: ${CAPTURE_WORKER_SHARED_SECRET:-}
      # Uploads disabled by default for local runs. Set S3_BUCKET etc. to flip on.
      S3_BUCKET: ${CAPTURE_WORKER_S3_BUCKET:-}
      S3_REGION: ${CAPTURE_WORKER_S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${CAPTURE_WORKER_S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${CAPTURE_WORKER_S3_SECRET_ACCESS_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  growth_tools_dev_postgres_data:
